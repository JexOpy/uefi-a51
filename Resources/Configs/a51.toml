#
# Samsung Galaxy A51 (SM-A515F, Exynos 9611 / S5E9611, bootloader A515FXXU8HWI1).
# Verified from on-device stock-boot.img (header_version = 2, DT_TABLE 0xd7b7ab1e).
# Dual-compatible with Mu-Silicium build_uefi.py (fd_base/fd_size) and
# UniXNU firmware.py / bootimg.py (base/size).
#

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs (3 MiB FV at 0xC9000000 to fit UniXNU + DarwinBoot + UfsDxe)
#
[uefi_fd]
base    = 0xC9000000
size    = 0x300000
fd_base = 0xC9000000
fd_size = 0x300000

#
# Android Boot Image Configs (Samsung S-Boot v2 + DT_TABLE in Resources/DTBs/a51.dtb)
#
[boot_image]
kernel_compression = "none"
dtb_location       = "outside"
header_version     = 2
base               = 0x10000000
kernel_offset      = 0x00008000
ramdisk_offset     = 0x01000000
tags_offset        = 0x00000100
pagesize           = 2048
